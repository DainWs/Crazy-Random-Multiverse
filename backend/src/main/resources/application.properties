crm.persistence.type = MEMORY

# Client origin that REST and the socket allow, with credentials. Never "*" (CON-5)
crm.communication.origin=http://localhost:8080

crm.user.cleanup-interval=PT15M

spring.session.timeout=1d

logging.level.root = INFO
logging.level.com.dainws.games.crm = TRACE
logging.level.org.springframework.messaging = DEBUG
logging.level.org.springframework.messaging.simp.user.UserDestinationMessageHandler = OFF
